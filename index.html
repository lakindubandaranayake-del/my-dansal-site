<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>දන්සැල් ලෝකය</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #fdf6f0; margin: 0; color: #333; }
        .hero { background: linear-gradient(135deg, #ff6600, #ff8c00); color: white; padding: 40px 20px; text-align: center; }
        .search-container { margin: 20px auto; max-width: 600px; text-align: center; }
        #searchInput { width: 80%; padding: 12px; border-radius: 25px; border: 1px solid #ccc; outline: none; }
        .container { max-width: 1000px; margin: 20px auto; padding: 20px; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .video-card { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 40px; background: white; border-radius: 15px; overflow: hidden; }
        th { background-color: #ff6600; color: white; padding: 15px; }
        td { padding: 15px; border-bottom: 1px solid #ddd; text-align: center; }
    </style>
</head>
<body>

    <div class="hero">
        <h1>✨ දන්සැල් ලෝකය ✨</h1>
        <div class="search-container">
            <input type="text" id="searchInput" onkeyup="searchTable()" placeholder="දන්සැල් නම සොයන්න...">
        </div>
    </div>

    <div class="container">
        <table id="dansalTable">
            <thead>
                <tr><th>දන්සැල</th><th>ස්ථානය</th><th>වේලාව</th></tr>
            </thead>
            <tbody>
                <tr><td>කිරි බත් දන්සැල</td><td>කොළඹ 07</td><td>ප.ව 2.00</td></tr>
                <tr><td>පැණි බීම දන්සැල</td><td>මහනුවර</td><td>ප.ව 4.00</td></tr>
                <tr><td>අයිස්ක්‍රීම් දන්සැල</td><td>අනුරාධපුරය</td><td>ප.ව 5.00</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        function searchTable() {
            let input = document.getElementById("searchInput").value.toLowerCase();
            let table = document.getElementById("dansalTable");
            let tr = table.getElementsByTagName("tr");
            for (let i = 1; i < tr.length; i++) {
                let td = tr[i].getElementsByTagName("td")[0];
                if (td) {
                    tr[i].style.display = td.innerText.toLowerCase().indexOf(input) > -1 ? "" : "none";
                }
            }
        }
    </script>
</body>
